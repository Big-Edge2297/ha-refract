name: Release

# Attaches refract.zip to a GitHub release. HACS downloads this file (zip_release in hacs.json),
# and GitHub counts the downloads of release files, which is what shows how often it is installed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach refract.zip to (for example v0.9.0)"
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: The manifest version matches the release tag
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/refract/manifest.json'))['version'])")
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::manifest.json says $version but the release tag is $TAG"
            exit 1
          fi

      - name: Zip the integration
        # HACS unpacks the zip into custom_components/refract, so the files sit at the top of the zip
        run: |
          cd custom_components/refract
          zip -r -X ../../refract.zip . -x "__pycache__/*" "*.pyc"
          cd ../..
          unzip -l refract.zip

      - name: Attach it to the release
        run: gh release upload "$TAG" refract.zip --clobber
