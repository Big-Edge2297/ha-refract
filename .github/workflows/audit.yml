name: Dependency audit

on:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main, master]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Libraries bundled into the card (fails on a known vulnerability)
        run: npm audit --omit=dev
      - name: Build tools (reported only, they are not part of the card)
        run: npm audit || true
