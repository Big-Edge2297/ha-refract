<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Refract stats card demo</title>
<style>
  :root { color-scheme: light dark; }
  /* @font-face is ignored inside a shadow root, so the icon font is declared here for the ha-icon stand-in */
  @font-face { font-family: "Material Design Icons"; src: url("https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.woff2?v=7.4.47") format("woff2"); }
  body { margin: 0; font-family: Roboto, system-ui, sans-serif; background: var(--primary-background-color); color: var(--primary-text-color); }
  body.light { --primary-background-color:#fafafa; --card-background-color:#fff; --secondary-background-color:#e5e5e5; --primary-text-color:#212121; --secondary-text-color:#727272; --divider-color:#e0e0e0; --primary-color:#03a9f4; }
  body.dark { --primary-background-color:#111111; --card-background-color:#1c1c1c; --secondary-background-color:#282828; --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --divider-color:#ffffff1f; --primary-color:#03a9f4; }
  .bar { display:flex; flex-wrap:wrap; gap:16px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--divider-color); font-size:14px; }
  .bar label { display:flex; gap:6px; align-items:center; }
  .stage { padding:16px; display:flex; justify-content:center; }
  #host { width:520px; max-width:100%; }
  #log { padding:0 16px 16px; font:12px/1.5 ui-monospace, monospace; color:var(--secondary-text-color); white-space:pre-wrap; }
</style>
</head>
<body class="dark">
<div class="bar">
  <label>Theme <select id="theme"><option>dark</option><option>light</option></select></label>
  <label>Width <input id="width" type="range" min="300" max="900" value="520" /> <span id="wv">520</span>px</label>
  <label>Layout <select id="layout"><option>full</option><option>compact</option><option>custom</option></select></label>
  <label>Library <select id="libstyle"><option>bar</option><option>list</option></select></label>
  <label>Watch time <select id="watchstyle"><option>bar</option><option>list</option></select></label>
  <label><input id="posters" type="checkbox" checked /> Posters (placeholder art)</label>
  <label>Duration <select id="dur"><option>days_hours</option><option>hours</option><option>auto</option></select></label>
  <label><input id="actions" type="checkbox" /> Mark watched button</label>
</div>
<div class="stage"><div id="host"></div></div>
<div id="log"></div>

<script>
  /* Minimal stand-ins for Home Assistant's own elements, only for this demo. */
  class HaCard extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML =
        `<style>:host{display:block;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:12px}</style><slot></slot>`;
    }
  }
  class HaIcon extends HTMLElement {
    static get observedAttributes() { return ["icon"]; }
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML =
        `<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"><style>:host{display:inline-flex;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);font-size:var(--mdc-icon-size,24px)}i{line-height:1}</style><i></i>`;
    }
    attributeChangedCallback() { this.shadowRoot.querySelector("i").className = "mdi mdi-" + (this.getAttribute("icon") || "").replace("mdi:", ""); }
    set icon(v) { this.setAttribute("icon", v); }
  }
  class HaRelativeTime extends HTMLElement {
    set datetime(v) {
      const h = (new Date(v) - Date.now()) / 36e5;
      this.textContent = new Intl.RelativeTimeFormat("en", { numeric: "auto" }).format(Math.round(h), "hour");
    }
    set hass(_) {}
  }
  customElements.define("ha-card", HaCard);
  customElements.define("ha-icon", HaIcon);
  customElements.define("ha-relative-time", HaRelativeTime);
</script>

<script type="module">
  import "/custom_components/refract/www/refract-stats-card.js";

  const P = "refract_codex_";
  const show = (title, year, refract, tmdb) => ({ type: "show", is_anime: false, ids: { refract, tmdb }, title, original_title: title, year });
  const item = (s, ep, aired, remaining) => ({ show: s, status: "in_progress", next_episode: ep, aired_episodes: aired, remaining_episodes: remaining });
  const westworld = item(show("Westworld", 2016, "357ebd89", 63247),
    { season: 1, number: 7, name: "Trompe L'Oeil", aired: true, is_season_premiere: false, is_season_finale: false, is_mid_season_finale: false }, 36, 30);
  const queue = [
    westworld,
    item(show("Lupin", 2021, "f65e21d1", 96677), { season: 3, number: 1, name: "Chapter 1", aired: true, is_season_premiere: true }, 20, 9),
    item(show("Severance", 2022, "aa11", 95396), { season: 2, number: 5, name: "Trojan's Horse", aired: true }, 19, 5),
    item(show("Andor", 2022, "bb22", 83867), { season: 2, number: 12, name: "Jedha, Kyber, Erso", aired: true, is_season_finale: true }, 24, 1),
    item(show("Slow Horses", 2022, "cc33", 95480), { season: 4, number: 3, name: "Episode 3", aired: false }, 24, 8),
    item(show("The Bear", 2022, "dd44", 136315), { season: 3, number: 2, name: "Next", aired: true }, 28, 18),
    item(show("Silo", 2023, "ee55", 125988), { season: 2, number: 4, name: "Episode 4", aired: true }, 20, 12),
  ];
  const e = (key, state, attributes = {}, domain = "sensor") => [`${domain}.${P}${key}`, { entity_id: `${domain}.${P}${key}`, state: String(state), attributes: { friendly_name: `Refract (sample_user) ${key}`, ...attributes } }];
  const hoursAgo = (h) => new Date(Date.now() - h * 36e5).toISOString();
  const states = Object.fromEntries([
    e("library_total", 897, { by_status: { completed: 803, up_to_date: 23, in_progress: 3, planned: 64, on_hold: 2, dropped: 2 } }), e("completed", 803), e("in_progress", 3), e("watchlist", 63), e("up_to_date", 23),
    e("movies", 693), e("tv_shows", 202), e("anime", 1),
    e("last_watched", hoursAgo(16), { title: "Westworld", season: 1, episode: 6 }),
    e("shows_waiting", 20, { items: queue }), e("next_up", "Westworld", westworld),
    e("stats_anime_episodes_watched", 291), e("stats_movies_watched", 661), e("stats_shows_episodes_watched", 7668),
    e("stats_streak_current_days", 6), e("stats_streak_longest_days", 24),
    e("stats_watch_time_anime_minutes", 7322), e("stats_watch_time_movies_minutes", 78542),
    e("stats_watch_time_shows_minutes", 298044), e("stats_watch_time_total_minutes", 383908),
    e("still_to_finish", 37770, {
      movies: { count: 26, minutes: 3000 },
      shows: { count: 37, minutes: 34770, episodes: 701, not_started: 32, started: 5, unknown_episodes: 0 },
      anime: { count: 0, minutes: 0, episodes: 0, not_started: 0, started: 0, unknown_episodes: 0 },
      estimated: true, unknown_episode_shows: 0,
    }),
  ]);

  const day = (n) => new Date(Date.now() + n * 864e5).toISOString().slice(0, 10);
  const poster = (c1, c2, title) => {
    // Typographic stand-in artwork (not real posters): gradient, a big initial and the title.
    const words = title.toUpperCase().split(" ");
    const lines = words.length > 1 ? [words[0], words.slice(1).join(" ")] : [words[0]];
    const text = lines.map((l, i) => `<text x="92" y="${252 + (i - (lines.length - 1)) * 24}" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21" letter-spacing="2" fill="#fff">${l}</text>`).join("");
    return "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="185" height="278"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="185" height="278" fill="url(#g)"/><text x="92" y="170" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="170" fill="#fff" fill-opacity=".16">${title[0]}</text>${text}</svg>`);
  };
  const art = { Westworld: poster("#8a6a4a", "#2f2418", "Westworld"), "The Bear": poster("#b5483a", "#3a1712", "The Bear"), Silo: poster("#4a6a7a", "#16222a", "Silo"), Lupin: poster("#2f5d62", "#0f1f26", "Lupin") };
  const days7 = [[3, 0], [0, 0], [2, 1], [4, 0], [1, 1], [0, 0], [2, 0]].map(([ep, mv], i) => ({ date: day(i - 6), episodes: ep, movies: mv }));
  const backlog = [["Westworld", 30, 63247], ["The Bear", 18, 136315], ["Silo", 12, 125988], ["Lupin", 9, 96677]].map(([title, remaining, tmdb_id]) => {
    const q = queue.find((x) => x.show.ids.tmdb === tmdb_id);
    return { title, year: 2020, is_anime: false, remaining, aired_episodes: q.aired_episodes, next_episode: q.next_episode, tmdb_id, refract_id: q.show.ids.refract, poster_url: null };
  });
  const airing = [[0, "Westworld", 1, 10, false, false, true, "08:00"], [1, "Severance", 2, 6, false, false, false, "02:00"], [3, "Frieren", 1, 4, true, true, false, null]].map(([d, show, season, number, is_anime, premiere, finale, time]) => ({ date: day(d), show, season, number, title: null, is_anime, premiere, finale, air_at: time ? `${day(d)}T${time}:00.000Z` : null }));
  const withArt = (on) => ({
    next: on ? { ...westworld, poster_url: art.Westworld } : westworld,
    catchup: backlog.map((b) => ({ ...b, poster_url: on ? art[b.title] : null })),
  });
  const dynamic = (on) => {
    const a = withArt(on);
    return Object.fromEntries([
      e("next_up", "Westworld", a.next),
      e("catch_up", 69, { show_count: 4, estimated_minutes: 3105, shows: a.catchup }),
      e("last_7_days", 13, { days: days7, episodes: 12, movies: 2, busiest_day: { date: day(-3), count: 4 } }),
      e("average_per_week", 9.4, { items_per_week: 11.5, change_percent: 12, window_days: 28, estimated: true }),
      e("airing_this_week", 3, { episodes: airing }),
    ]);
  };

  const log = (m) => (document.getElementById("log").textContent = `${new Date().toLocaleTimeString()}  ${m}\n` + document.getElementById("log").textContent);
  const hass = {
    states, locale: { language: "en", time_zone: "local" }, config: { time_zone: "UTC" },
    services: { refract: { mark_episode_watched: {} } },
    callService: async (d, s, data) => log(`callService ${d}.${s} ${JSON.stringify(data)}`),
    callWS: async () => { throw new Error("demo"); },
  };

  const host = document.getElementById("host");
  const card = document.createElement("refract-stats-card");
  host.appendChild(card);
  const $ = (id) => document.getElementById(id);
  const apply = () => {
    document.body.className = $("theme").value;
    host.style.width = $("width").value + "px";
    $("wv").textContent = $("width").value;
    card.setConfig({
      type: "custom:refract-stats-card", entity: `sensor.${P}next_up`,
      layout: $("layout").value, library_style: $("libstyle").value, watch_time_style: $("watchstyle").value, duration_format: $("dur").value,
      show_actions: $("actions").checked,
    });
    card.hass = { ...hass, states: { ...states, ...dynamic($("posters").checked) } };
  };
  document.querySelectorAll(".bar select, .bar input").forEach((el) => el.addEventListener("input", apply));
  apply();
</script>
</body>
</html>
